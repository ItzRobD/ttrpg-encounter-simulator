<div class="grid gap-0 mt-2">
  @for (ability of specialAbilities(); track ability) {
    <div class="col-6 p-1">
      <div
        class="flex align-items-center gap-2 p-2 border-1 border-round surface-border bg-surface-50 h-full"
      >
        <i class="pi pi-sparkles text-primary" style="font-size: 0.7rem"></i>
        <span class="text-xs font-medium">{{ ability }}</span>
      </div>
    </div>
  }
</div>
