<div class="surface-card p-2 md:p-5 border-round shadow-2">
  <div class="flex flex-column md:flex-row justify-content-between align-items-center mb-4 gap-3">
    <h1 class="text-2xl md:text-3xl font-bold m-0 text-center md:text-left">Bestiary</h1>
    <div class="flex gap-2 w-full md:w-auto">
      <p-button
        label="Import Monster"
        icon="pi pi-download"
        severity="secondary"
        class="flex-grow-1 md:flex-grow-0"
      ></p-button>
      <p-button
        label="Create Monster"
        icon="pi pi-plus"
        severity="primary"
        class="flex-grow-1 md:flex-grow-0"
        (onClick)="onCreateMonster()"
      ></p-button>
    </div>
  </div>

  <p class="text-700 line-height-3 hidden md:block">
    Browse and manage your collection of monsters for simulations.
  </p>

  <div class="flex flex-column md:flex-row mt-4 md:mt-6 gap-3 overflow-hidden">
    <!-- Monsters List Column -->
    <div class="w-full md:w-5 lg:w-7 flex-shrink-0">
      <div class="flex flex-column gap-4 border-1 surface-border border-round p-3 h-full overflow-hidden">
        <div class="flex justify-content-between align-items-center">
          <h3 class="text-xl font-semibold m-0 white-space-nowrap">
            Monsters
          </h3>
          <div class="flex gap-2">
            <p-iconfield iconPosition="left" class="w-full md:w-12rem lg:w-15rem">
              <p-inputicon class="pi pi-search"></p-inputicon>
              <input
                type="text"
                pInputText
                placeholder="Search..."
                class="w-full p-inputtext-sm"
                [value]="searchTerm()"
                (input)="onSearch($event)"
              />
              @if (searchTerm()) {
                <p-inputicon
                  class="pi pi-times cursor-pointer"
                  (click)="onClearSearch()"
                ></p-inputicon>
              }
            </p-iconfield>
          </div>
        </div>

        <div class="flex flex-column gap-2 flex-1 overflow-auto">
          <!-- Entities Table -->
          <app-shared-table
            mode="monster"
            [searchTerm]="searchTerm()"
            [showAddToSimulator]="true"
            (addToSimulator)="onAddToSimulator($event)"
          ></app-shared-table>
        </div>
      </div>
    </div>

    <!-- Monster Detail Column -->
    <div
      class="flex-1 min-w-0"
    >
      <div class="p-2 md:p-4 border-1 surface-border border-round h-full min-h-20rem">
        <div class="flex justify-content-between align-items-center mb-4 border-bottom-1 surface-border pb-3">
          <h3 class="text-xl font-semibold m-0">Monster</h3>
          @if (monsterService.selectedMonster(); as item) {
            <div class="flex gap-2">
              <p-button
                icon="pi pi-pencil"
                [text]="true"
                pTooltip="Edit Monster"
                (onClick)="onEditMonster(item)"
              ></p-button>
              <p-button
                icon="pi pi-copy"
                [text]="true"
                pTooltip="Duplicate Monster"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                pTooltip="Delete Monster"
                (onClick)="onDeleteMonster(item)"
              ></p-button>
            </div>
          }
        </div>

        <div class="flex flex-column gap-3">
          @if (monsterService.selectedMonster(); as monster) {
            <app-entity-card [entity]="monster" [hideState]="true" [startExpanded]="true"></app-entity-card>
          } @else {
            <p class="text-600 italic">Select a monster from the list to view its details.</p>
          }
        </div>
      </div>
    </div>
  </div>
</div>

<app-monster-editor
  [(visible)]="isEditorVisible"
  [itemToEdit]="monsterToEdit()"
></app-monster-editor>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
