<div class="surface-card p-2 md:p-5 border-round shadow-2">
  <div class="flex flex-column md:flex-row justify-content-between align-items-center mb-4 gap-3">
    <h1 class="text-2xl md:text-3xl font-bold m-0 text-center md:text-left">Spells</h1>
    <div class="flex gap-2 w-full md:w-auto">
      <p-button
        label="Import Spell"
        icon="pi pi-download"
        severity="secondary"
        class="flex-grow-1 md:flex-grow-0"
      ></p-button>
      <p-button
        label="Create Spell"
        icon="pi pi-plus"
        severity="primary"
        class="flex-grow-1 md:flex-grow-0"
        (onClick)="onCreateSpell()"
      ></p-button>
    </div>
  </div>

  <p class="text-700 line-height-3 hidden md:block">
    Browse and manage spells for your combatants.
  </p>

  <div class="flex flex-column md:flex-row mt-4 md:mt-6 gap-3 overflow-hidden">
    <!-- Spell List Column -->
    <div class="w-full md:w-5 lg:w-7 flex-shrink-0">
      <div class="flex flex-column gap-4 border-1 surface-border border-round p-3 h-full overflow-hidden">
        <div class="flex justify-content-between align-items-center">
          <h3 class="text-xl font-semibold m-0 white-space-nowrap">
            Spells
          </h3>
          <div class="flex gap-2">
            <p-iconfield iconPosition="left" class="w-full md:w-12rem lg:w-15rem">
              <p-inputicon class="pi pi-search"></p-inputicon>
              <input
                type="text"
                pInputText
                placeholder="Search..."
                class="w-full p-inputtext-sm"
                [value]="searchTerm()"
                (input)="onSearch($event)"
              />
              @if (searchTerm()) {
                <p-inputicon
                  class="pi pi-times cursor-pointer"
                  (click)="onClearSearch()"
                ></p-inputicon>
              }
            </p-iconfield>
          </div>
        </div>

        <div class="flex flex-column gap-2 flex-1 overflow-auto">
          <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
            <p-tablist>
              <p-tab value="all">All</p-tab>
              <p-tab value="damage">Damage</p-tab>
              <p-tab value="healing">Healing</p-tab>
              <p-tab value="utility">Utility</p-tab>
            </p-tablist>
          </p-tabs>
          <!-- Spells Table -->
          <app-shared-table
            mode="spells"
            [searchTerm]="searchTerm()"
            [categoryFilter]="activeTab()"
          ></app-shared-table>
        </div>
      </div>
    </div>

    <!-- Spell Detail Column -->
    <div class="flex-1 min-w-0">
      <div class="p-2 md:p-4 border-1 surface-border border-round h-full min-h-20rem">
        <div class="flex justify-content-between align-items-center mb-4 border-bottom-1 surface-border pb-3">
          <h3 class="text-xl font-semibold m-0">Spell Details</h3>
          @if (spellsService.selectedSpell(); as item) {
            <div class="flex gap-2">
              <p-button
                icon="pi pi-pencil"
                [text]="true"
                pTooltip="Edit Spell"
                (onClick)="onEditSpell(item)"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                pTooltip="Delete Spell"
                (onClick)="onDeleteSpell(item)"
              ></p-button>
            </div>
          }
        </div>

        <div class="flex flex-column gap-3">
          @if (spellsService.selectedSpell(); as selectedItem) {
            <app-spell-card [item]="selectedItem"></app-spell-card>
          } @else {
            <p class="text-600 italic">Select a spell from the list to view its details.</p>
          }
        </div>
      </div>
    </div>
  </div>
</div>

<app-spell-editor
  [(visible)]="isEditorVisible"
  [itemToEdit]="spellToEdit()"
></app-spell-editor>
