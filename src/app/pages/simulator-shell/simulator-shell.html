<div class="surface-card p-2 md:p-5 border-round shadow-2">
  <div class="flex flex-column md:flex-row justify-content-between align-items-center mb-4 gap-3">
    <h1 class="text-2xl md:text-3xl font-bold m-0 text-center md:text-left">Encounter Simulator</h1>
    <p-button label="Add Combatant" icon="pi pi-plus" class="w-full md:w-auto"></p-button>
  </div>

  <p class="text-700 line-height-3 hidden md:block">
    Welcome to the D&D 5e Encounter Simulator. Here you can build your encounter by adding
    characters and monsters, configure simulation options, and run deterministic combat previews.
  </p>

  <div class="mt-4 md:mt-6 grid">
    <div class="col-12 xl:col-6">
      <div class="p-2 md:p-4 border-1 surface-border border-round">
        <h3 class="text-xl font-semibold mb-2">Active Combatants</h3>
        <div class="grid">
          <div class="col-12 sm:col-10 md:col-8 lg:col-12 xl:col-12">
            <app-entity-card></app-entity-card>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 xl:col-6">
      <div class="p-2 md:p-4 border-1 surface-border border-round h-full">
        <h3 class="text-xl font-semibold mb-2">Simulation Results</h3>
        <p class="text-600">Run a simulation to see the timeline here.</p>
      </div>
    </div>
  </div>
</div>
