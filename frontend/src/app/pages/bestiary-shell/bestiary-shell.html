<app-library-page
  title="Bestiary"
  description="Browse and manage your collection of monsters for simulations."
  listTitle="Monsters"
  detailTitle="Monster"
  emptyMessage="Select a monster from the list to view its details."
  [hasSelection]="!!monsterService.selectedMonster()"
  [search]="searchTerm()"
  (searchChange)="searchTerm.set($event)"
>
  <ng-container actions>
    <p-button label="Import Monster" icon="pi pi-download" severity="secondary"></p-button>
    <p-button label="Create Monster" icon="pi pi-plus" severity="primary" (onClick)="onCreateMonster()"></p-button>
  </ng-container>

  <p-tabs tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab value="all">All</p-tab>
      <p-tab value="srd">SRD</p-tab>
      <p-tab value="custom">Custom</p-tab>
    </p-tablist>
  </p-tabs>

  <app-shared-table
    list
    mode="monster"
    [searchTerm]="searchTerm()"
    [categoryFilter]="activeTab()"
    [showAddToSimulator]="true"
    (addToSimulator)="onAddToSimulator($event)"
  ></app-shared-table>

  <ng-container detailActions>
    <p-button icon="pi pi-pencil" [text]="true" pTooltip="Edit Monster" (onClick)="onEditMonster(monsterService.selectedMonster()!)"></p-button>
    <p-button icon="pi pi-copy" [text]="true" pTooltip="Duplicate Monster"></p-button>
    <p-button icon="pi pi-trash" severity="danger" [text]="true" pTooltip="Delete Monster" (onClick)="onDeleteMonster(monsterService.selectedMonster()!)"></p-button>
  </ng-container>

  <ng-container detail>
    @if (monsterService.selectedMonster(); as a) {
      <app-actor-card [actor]="a" [hideState]="true" [startExpanded]="true"></app-actor-card>
    }
  </ng-container>
</app-library-page>

<app-monster-editor [(visible)]="isEditorVisible" [itemToEdit]="monsterToEdit()"></app-monster-editor>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
