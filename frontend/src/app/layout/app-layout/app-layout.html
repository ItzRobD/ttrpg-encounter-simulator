@if (environmentName === 'dev' || environmentName === 'local') {
  <div class="env-bar"></div>
  <div class="env-tab">{{ environmentName | titlecase }}</div>
}

<div class="layout" [class.nav-collapsed]="isSidebarCollapsed()" [class.nav-autoslide]="autoSlideSidebar()">
  <p-drawer [(visible)]="visible" header="D&D Simulator">
    <nav class="drawer-nav">
      @for (item of navItems; track item.route) {
        <a
          class="nav-link"
          [routerLink]="item.route"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          routerLinkActive="is-active"
          (click)="visible = false"
        >
          <i [class]="item.icon"></i><span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </p-drawer>

  <aside class="sidebar">
    <div class="sidebar-head">
      <p-button
        [icon]="isSidebarCollapsed() ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"
        (onClick)="toggleSidebar()"
        [text]="true"
        severity="secondary"
        size="small"
        [pTooltip]="isSidebarCollapsed() ? 'Expand Sidebar' : 'Collapse Sidebar'"
        tooltipPosition="right"
      ></p-button>
      <span class="brand">D&D Sim</span>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a
          class="nav-link"
          [routerLink]="item.route"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          routerLinkActive="is-active"
          [pTooltip]="isSidebarCollapsed() ? item.label : ''"
          tooltipPosition="right"
        >
          <i [class]="item.icon"></i><span class="nav-label">{{ item.label }}</span>
        </a>
      }

      <div class="sidebar-foot">
        <span class="nav-label foot-label">Auto-slide</span>
        <p-button
          [icon]="autoSlideSidebar() ? 'pi pi-eye' : 'pi pi-eye-slash'"
          [text]="true"
          severity="secondary"
          size="small"
          (onClick)="toggleAutoSlide()"
          [pTooltip]="autoSlideSidebar() ? 'Disable Auto-slide' : 'Enable Auto-slide'"
          tooltipPosition="right"
        ></p-button>
      </div>
    </nav>
  </aside>

  <div class="content">
    <header class="topbar">
      <p-button
        class="nav-toggle-mobile"
        icon="pi pi-bars"
        (click)="visible = true"
        [text]="true"
        severity="secondary"
        aria-label="Open navigation"
      ></p-button>
      <span class="brand-mobile">D&D Sim</span>

      <div class="topbar-actions">
        <p-button
          [icon]="theme.isDark() ? 'pi pi-moon' : 'pi pi-sun'"
          [text]="true"
          severity="secondary"
          (onClick)="theme.toggleMode()"
          [attr.aria-pressed]="theme.isDark()"
          [pTooltip]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          tooltipPosition="bottom"
          aria-label="Toggle dark mode"
        ></p-button>
        <p-button
          icon="pi pi-palette"
          [text]="true"
          severity="secondary"
          (onClick)="themePanel.toggle($event)"
          pTooltip="Dragon theme"
          tooltipPosition="bottom"
          aria-label="Choose dragon theme"
        ></p-button>
        <p-popover #themePanel>
          <app-theme-switcher />
          <div class="theme-popover-foot">
            <p-button
              label="Preview"
              icon="pi pi-eye"
              [text]="true"
              size="small"
              (onClick)="themePanel.hide(); themePreviewVisible.set(true)"
            ></p-button>
          </div>
        </p-popover>
      </div>
    </header>

    <main class="page">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<app-theme-preview-dialog [(visible)]="themePreviewVisible" />
