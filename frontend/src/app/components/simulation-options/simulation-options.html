<p-drawer
  [visible]="visible()"
  (onHide)="onHide()"
  position="right"
  header="Simulation Options"
  [style]="{ width: '400px' }"
  [blockScroll]="true"
>
  <div class="opt-body">
    <p-accordion [multiple]="true" [value]="['0', '1', '2', '3', '4']">
      <!-- General & Seeds -->
      <p-accordion-panel value="0">
        <p-accordion-header>General & Seed</p-accordion-header>
        <p-accordion-content>
          <div class="opt-section">
            <div class="opt-field">
              <label class="opt-label">Simulation Seed</label>
              <div class="opt-field">
                <p-inputNumber
                  [ngModel]="options().seed.seed1"
                  (ngModelChange)="updateSeed('seed1', $event)"
                  placeholder="Seed 1"
                  [useGrouping]="false"
                ></p-inputNumber>
                <p-inputNumber
                  [ngModel]="options().seed.seed2"
                  (ngModelChange)="updateSeed('seed2', $event)"
                  placeholder="Seed 2"
                  [useGrouping]="false"
                ></p-inputNumber>
              </div>
              <small class="opt-hint">Set seeds for deterministic results (0 for random).</small>
            </div>

            <div class="opt-row">
              <label for="numberOfRuns" class="opt-label">Number of Runs</label>
              <p-inputNumber
                [ngModel]="config().numberOfRuns"
                (ngModelChange)="updateConfig('numberOfRuns', $event)"
                placeholder="20"
                [useGrouping]="false"
              ></p-inputNumber>
            </div>
            <div class="opt-row">
              <label for="maxRounds" class="opt-label">Max Rounds</label>
              <p-inputNumber
                [ngModel]="config().maxRounds"
                (ngModelChange)="updateConfig('maxRounds', $event)"
                placeholder="30"
                [useGrouping]="false"
              ></p-inputNumber>
            </div>
            <div class="opt-row">
              <label for="includeLogs" class="opt-label">Include Logs</label>
              <p-toggleswitch
                id="includeLogs"
                [ngModel]="config().includeLogs"
                (ngModelChange)="updateConfig('includeLogs', $event)"
                [disabled]="environment.config.disableIncludeLogsToggle"
              ></p-toggleswitch>
            </div>

            <div class="opt-row">
              <label for="useHPAverageMonster" class="opt-label">Average Monster HP</label>
              <p-toggleswitch
                id="useHPAverageMonster"
                [ngModel]="options().useHPAverageMonster"
                (ngModelChange)="updateOption('useHPAverageMonster', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label for="useHPAverageCharacter" class="opt-label">Average Character HP</label>
              <p-toggleswitch
                id="useHPAverageCharacter"
                [ngModel]="options().useHPAverageCharacter"
                (ngModelChange)="updateOption('useHPAverageCharacter', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label for="includeStateSnapshots" class="opt-label">Include State Snapshots</label>
              <p-toggleswitch
                id="includeStateSnapshots"
                [ngModel]="options().includeStateSnapshots"
                (ngModelChange)="updateOption('includeStateSnapshots', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label for="maxLoggedRuns" class="opt-label">Max Logged Runs</label>
              <p-inputNumber
                id="maxLoggedRuns"
                [ngModel]="options().maxLoggedRuns"
                (ngModelChange)="updateOption('maxLoggedRuns', $event)"
                placeholder="10"
                [useGrouping]="false"
                [min]="1"
                [max]="100"
              ></p-inputNumber>
            </div>
          </div>
        </p-accordion-content>
      </p-accordion-panel>

      <!-- Combat Rules -->
      <p-accordion-panel value="1">
        <p-accordion-header>Combat Rules</p-accordion-header>
        <p-accordion-content>
          <div class="opt-section">
            <div class="opt-row">
              <label class="opt-label">Monsters Can Crit</label>
              <p-toggleswitch
                [ngModel]="options().canMonstersCrit"
                (ngModelChange)="updateOption('canMonstersCrit', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Characters Can Crit</label>
              <p-toggleswitch
                [ngModel]="options().canCharactersCrit"
                (ngModelChange)="updateOption('canCharactersCrit', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Improved Criticals</label>
              <p-toggleswitch
                [ngModel]="options().useImprovedCritical"
                (ngModelChange)="updateOption('useImprovedCritical', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Always Upcast (NPCs)</label>
              <p-toggleswitch
                [ngModel]="options().monstersAlwaysUpcast"
                (ngModelChange)="updateOption('monstersAlwaysUpcast', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">AOE Hits All Enemies</label>
              <p-toggleswitch
                [ngModel]="options().aoeHitsAllEnemies"
                (ngModelChange)="updateOption('aoeHitsAllEnemies', $event)"
              ></p-toggleswitch>
            </div>
          </div>
        </p-accordion-content>
      </p-accordion-panel>

      <!-- Class & Racial Features -->
      <p-accordion-panel value="2">
        <p-accordion-header>Features & Abilities</p-accordion-header>
        <p-accordion-content>
          <div class="opt-section">
            <div class="opt-row">
              <label class="opt-label">Enable Class Features</label>
              <p-toggleswitch
                [ngModel]="options().enableClassFeatures"
                (ngModelChange)="updateOption('enableClassFeatures', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Enable Racial Features</label>
              <p-toggleswitch
                [ngModel]="options().enableRacialFeatures"
                (ngModelChange)="updateOption('enableRacialFeatures', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Paladins Always Smite</label>
              <p-toggleswitch
                [ngModel]="options().paladinAlwaysSmite"
                (ngModelChange)="updateOption('paladinAlwaysSmite', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Always Sneak Attack</label>
              <p-toggleswitch
                [ngModel]="options().alwaysUseSneakAttack"
                (ngModelChange)="updateOption('alwaysUseSneakAttack', $event)"
              ></p-toggleswitch>
            </div>

            <div class="opt-field">
              <label class="opt-label">Char. Heal Threshold %</label>
              <p-inputNumber
                [ngModel]="options().characterHealThresholdPct"
                (ngModelChange)="updateOption('characterHealThresholdPct', $event)"
                [min]="0"
                [max]="100"
                suffix="%"
                [showButtons]="true"
              ></p-inputNumber>
            </div>
            <div class="opt-field">
              <label class="opt-label">Char. Emergency Threshold %</label>
              <p-inputNumber
                [ngModel]="options().characterEmergencyThresholdPct"
                (ngModelChange)="updateOption('characterEmergencyThresholdPct', $event)"
                [min]="0"
                [max]="100"
                suffix="%"
                [showButtons]="true"
              ></p-inputNumber>
            </div>

            <div class="opt-field">
              <label class="opt-label">Monster Heal Threshold %</label>
              <p-inputNumber
                [ngModel]="options().monsterHealThresholdPct"
                (ngModelChange)="updateOption('monsterHealThresholdPct', $event)"
                [min]="0"
                [max]="100"
                suffix="%"
                [showButtons]="true"
              ></p-inputNumber>
            </div>
            <div class="opt-field">
              <label class="opt-label">Monster Emergency Threshold %</label>
              <p-inputNumber
                [ngModel]="options().monsterEmergencyThresholdPct"
                (ngModelChange)="updateOption('monsterEmergencyThresholdPct', $event)"
                [min]="0"
                [max]="100"
                suffix="%"
                [showButtons]="true"
              ></p-inputNumber>
            </div>
          </div>
        </p-accordion-content>
      </p-accordion-panel>

      <!-- AI & Visibility -->
      <p-accordion-panel value="3">
        <p-accordion-header>AI & Premium Options</p-accordion-header>
        <p-accordion-content>
          <div class="opt-section">
            <div class="opt-field">
              <label class="opt-label">HP Visibility</label>
              <p-selectbutton
                [options]="hpVisibilityOptions"
                [ngModel]="options().hpVisibilityMode"
                (ngModelChange)="updateOption('hpVisibilityMode', $event)"
              ></p-selectbutton>
            </div>

            <div class="opt-row">
              <label class="opt-label">Use Weighted AI</label>
              <p-toggleswitch
                [ngModel]="options().useWeightedAI"
                (ngModelChange)="updateOption('useWeightedAI', $event)"
              ></p-toggleswitch>
            </div>

            <div class="opt-row">
              <label class="opt-label">Enable Monster Noise</label>
              <p-toggleswitch
                [ngModel]="options().enableMonsterNoise"
                (ngModelChange)="updateOption('enableMonsterNoise', $event)"
              ></p-toggleswitch>
            </div>

            @if (options().enableMonsterNoise) {
              <div class="opt-field">
                <label class="opt-label">Noise Weight ({{ options().monsterNoiseWeight }})</label>
                <p-inputNumber
                  [ngModel]="options().monsterNoiseWeight"
                  (ngModelChange)="updateOption('monsterNoiseWeight', $event)"
                  [min]="0"
                  [max]="1"
                  [step]="0.01"
                  [showButtons]="true"
                ></p-inputNumber>
              </div>
            }

            <div class="opt-row">
              <label class="opt-label">Debug AI Logs</label>
              <p-toggleswitch
                [ngModel]="options().debugAI"
                (ngModelChange)="updateOption('debugAI', $event)"
              ></p-toggleswitch>
            </div>

            <div class="opt-field">
              <label class="opt-label">Multiattack Policy</label>
              <p-selectbutton
                [options]="multiattackPolicyOptions"
                [ngModel]="options().multiattackPolicy"
                (ngModelChange)="updateOption('multiattackPolicy', $event)"
              ></p-selectbutton>
            </div>

            <div class="opt-field">
              <label class="opt-label">Action Selection Policy</label>
              <p-selectbutton
                [options]="actionSelectionPolicyOptions"
                [ngModel]="options().actionSelectionPolicy"
                (ngModelChange)="updateOption('actionSelectionPolicy', $event)"
              ></p-selectbutton>
            </div>

            <div class="opt-row">
              <label class="opt-label">AOE Target Threshold</label>
              <p-inputNumber
                [ngModel]="options().aoeTargetThreshold"
                (ngModelChange)="updateOption('aoeTargetThreshold', $event)"
                [min]="1"
                [max]="20"
                [showButtons]="true"
              ></p-inputNumber>
            </div>

            <div class="opt-row">
              <label class="opt-label">Disable Monster Turns</label>
              <p-toggleswitch
                [ngModel]="options().disableMonsterTurns"
                (ngModelChange)="updateOption('disableMonsterTurns', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Disable Character Turns</label>
              <p-toggleswitch
                [ngModel]="options().disableCharacterTurns"
                (ngModelChange)="updateOption('disableCharacterTurns', $event)"
              ></p-toggleswitch>
            </div>
            <div class="opt-row">
              <label class="opt-label">Disable Lair Turns</label>
              <p-toggleswitch
                [ngModel]="options().disableLairTurns"
                (ngModelChange)="updateOption('disableLairTurns', $event)"
              ></p-toggleswitch>
            </div>
          </div>
        </p-accordion-content>
      </p-accordion-panel>

      <!-- Intermission Options -->
      <p-accordion-panel value="4">
        <p-accordion-header>Intermission Rules</p-accordion-header>
        <p-accordion-content>
          <div class="opt-section">
            <div class="opt-field">
              <label class="opt-label">Max Short Rests</label>
              <p-inputNumber
                [ngModel]="intermissionConfig().maxShortRests"
                (ngModelChange)="updateIntermission('maxShortRests', $event)"
                [min]="0"
                [max]="10"
                [showButtons]="true"
              ></p-inputNumber>
            </div>
            <div class="opt-field">
              <label class="opt-label">Short Rest Heal Threshold</label>
              <p-inputNumber
                [ngModel]="intermissionConfig().shortRestHealThreshold"
                (ngModelChange)="updateIntermission('shortRestHealThreshold', $event)"
                [min]="0"
                [max]="1"
                [step]="0.05"
                [showButtons]="true"
                mode="decimal"
              ></p-inputNumber>
              <small class="opt-hint">Heal if current HP < this % of max HP.</small>
            </div>
            <div class="opt-field">
              <label class="opt-label">Post-Rest Heal Threshold</label>
              <p-inputNumber
                [ngModel]="intermissionConfig().postRestHealThreshold"
                (ngModelChange)="updateIntermission('postRestHealThreshold', $event)"
                [min]="0"
                [max]="1"
                [step]="0.05"
                [showButtons]="true"
                mode="decimal"
              ></p-inputNumber>
              <small class="opt-hint">Target HP % after resting.</small>
            </div>
          </div>
        </p-accordion-content>
      </p-accordion-panel>
    </p-accordion>
  </div>
</p-drawer>
