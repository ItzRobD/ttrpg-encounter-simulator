<p-dialog
  [header]="'Add ' + (mode() === 'monster' ? 'Monsters' : 'Characters')"
  [(visible)]="visible"
  [modal]="true"
  [breakpoints]="{ '960px': '75vw', '640px': '100vw' }"
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onHide()"
>
  <div class="p-3">
    <app-shared-table
      [mode]="mode()"
      [showAddToSimulator]="true"
      (addToSimulator)="onAddToSimulator($event)"
    ></app-shared-table>
  </div>
</p-dialog>

<p-toast></p-toast>
