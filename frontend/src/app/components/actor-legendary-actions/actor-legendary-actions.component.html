<div class="la-wrap">
  @for (action of legendaryActions(); track action.actionId || $index) {
    <p-card class="la-card" [dt]="{ bodyPadding: '0.4rem', contentPadding: '0' }">
      <div class="la-row">
        <i class="pi pi-star la-icon"></i>
        <span class="la-text">
          <strong>{{ action.name }}</strong>
          {{ formatMonsterAction(action) }}
        </span>
      </div>
    </p-card>
  }
</div>
