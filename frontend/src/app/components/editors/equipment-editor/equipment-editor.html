<p-dialog
  [header]="itemToEdit() ? 'Edit Custom Item' : 'Create Custom Item'"
  [visible]="visible()"
  (visibleChange)="close()"
  [modal]="true"
  [breakpoints]="{ '960px': '85vw', '640px': '95vw' }"
  [style]="{ width: '600px' }"
  [draggable]="false"
  [resizable]="false"
>
  <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab value="weapon" [disabled]="!!itemToEdit() && activeTab() !== 'weapon'">Weapon</p-tab>
      <p-tab value="armor" [disabled]="!!itemToEdit() && activeTab() !== 'armor'">Armor</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="weapon">
        <form [formGroup]="weaponForm" (ngSubmit)="onSave()" class="ee-form">
          <p-fluid>
            @if (error()) {
              <p-message severity="error" class="ee-error">{{ error() }}</p-message>
            }
            <div class="ee-body">
              <div class="ee-field">
                <label for="w-name" class="ee-label">Weapon Name</label>
                <input pInputText id="w-name" formControlName="name" placeholder="e.g. Flaming Longsword"
                       [class.p-invalid]="weaponForm.get('name')?.invalid && weaponForm.get('name')?.touched" />
              </div>

              <div class="ee-grid3">
                <div class="ee-field">
                  <label for="w-diceCount" class="ee-label">Dice Count</label>
                  <p-inputNumber id="w-diceCount" formControlName="numberOfDice" [min]="0"
                                 [max]="20"
                                 [showButtons]="true"></p-inputNumber>
                </div>
                <div class="ee-field">
                  <label for="w-die" class="ee-label">Die</label>
                  <p-select id="w-die" formControlName="die" [options]="diceOptions" optionLabel="label" optionValue="value" appendTo="body"></p-select>
                </div>
                <div class="ee-field">
                  <label for="w-damageType" class="ee-label">Type</label>
                  <p-select id="w-damageType" formControlName="damageType" [options]="damageTypes" optionLabel="label" optionValue="value" appendTo="body"></p-select>
                </div>
              </div>

              <div class="ee-field">
                <label class="ee-label">Properties</label>
                <div formGroupName="properties" class="ee-checks">
                  <div class="ee-check">
                    <p-checkbox formControlName="isVersatile" [binary]="true" inputId="isVersatile"></p-checkbox>
                    <label for="isVersatile" class="ee-check-label">Versatile</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isFinesse" [binary]="true" inputId="isFinesse"></p-checkbox>
                    <label for="isFinesse" class="ee-check-label">Finesse</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isRanged" [binary]="true" inputId="isRanged"></p-checkbox>
                    <label for="isRanged" class="ee-check-label">Ranged</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isHeavy" [binary]="true" inputId="isHeavy"></p-checkbox>
                    <label for="isHeavy" class="ee-check-label">Heavy</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isTwoHanded" [binary]="true" inputId="isTwoHanded"></p-checkbox>
                    <label for="isTwoHanded" class="ee-check-label">Two-Handed</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isLight" [binary]="true" inputId="isLight"></p-checkbox>
                    <label for="isLight" class="ee-check-label">Light</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isThrown" [binary]="true" inputId="isThrown"></p-checkbox>
                    <label for="isThrown" class="ee-check-label">Thrown</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isOnlyRanged" [binary]="true" inputId="isOnlyRanged"></p-checkbox>
                    <label for="isOnlyRanged" class="ee-check-label">Ammo Only</label>
                  </div>
                </div>
              </div>

              <div class="ee-field" formGroupName="modifiers">
                <label class="ee-label">Modifiers</label>
                <div class="ee-checks">
                  <div class="ee-check">
                    <p-checkbox formControlName="isMagic" [binary]="true" inputId="isMagic"></p-checkbox>
                    <label for="isMagic" class="ee-check-label">Magic</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isSilvered" [binary]="true" inputId="isSilvered"></p-checkbox>
                    <label for="isSilvered" class="ee-check-label">Silvered</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isAdamantine" [binary]="true" inputId="isAdamantine"></p-checkbox>
                    <label for="isAdamantine" class="ee-check-label">Adamantine</label>
                  </div>
                  <div class="ee-check">
                    <p-checkbox formControlName="isColdForgedIron" [binary]="true" inputId="isColdForgedIron"></p-checkbox>
                    <label for="isColdForgedIron" class="ee-check-label">Cold Iron</label>
                  </div>
                </div>
                <div class="ee-grid2">
                  <div class="ee-field">
                    <label for="w-atk" class="ee-label-sm">Attack Bonus</label>
                    <p-inputNumber id="w-atk" formControlName="attackBonus" [showButtons]="true" [min]="-20" [max]="20"></p-inputNumber>
                  </div>
                  <div class="ee-field">
                    <label for="w-dmg" class="ee-label-sm">Damage Bonus</label>
                    <p-inputNumber id="w-dmg" formControlName="damageBonus" [showButtons]="true" [min]="-20" [max]="20"></p-inputNumber>
                  </div>
                </div>
              </div>
            </div>
          </p-fluid>

          <div class="ee-footer">
            <p-button label="Cancel" [text]="true" severity="secondary" (onClick)="close()" [disabled]="loading()"></p-button>

            <p-splitButton
              [label]="primarySaveLabel()"
              [icon]="loading() ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
              (onClick)="onSaveAttempt()"
              [model]="saveOptions()"
              [disabled]="loading() || weaponForm.invalid">
            </p-splitButton>
          </div>
        </form>
      </p-tabpanel>

      <p-tabpanel value="armor">
        <form [formGroup]="armorForm" (ngSubmit)="onSave()" class="ee-form">
          <p-fluid>
            @if (error()) {
              <p-message severity="error" class="ee-error">{{ error()! }}</p-message>
            }
            <div class="ee-body">
              <div class="ee-field">
                <label for="a-name" class="ee-label">Armor Name</label>
                <input pInputText id="a-name" formControlName="name" placeholder="e.g. Plate Armor +1"
                       [class.p-invalid]="armorForm.get('name')?.invalid && armorForm.get('name')?.touched" />
              </div>

              <div class="ee-grid2">
                <div class="ee-field">
                  <label for="a-ac" class="ee-label">AC Base</label>
                  <p-inputNumber id="a-ac" formControlName="ac" [min]="0" [max]="30"
                                 [showButtons]="true"></p-inputNumber>
                </div>
                <div class="ee-field">
                  <label for="a-mod" class="ee-label">Modifier</label>
                  <p-inputNumber id="a-mod" formControlName="modifier" [min]="-20" [max]="20" [showButtons]="true"
                                 pTooltip="Magical bonus to AC"></p-inputNumber>
                </div>
              </div>

              @let acVal = armorForm.get('ac')?.value || 0;
              @let modVal = armorForm.get('modifier')?.value || 0;
              <div class="ee-actotal">
                <span class="ee-actotal-label">Total AC: {{ acVal }}</span>
                @if (modVal !== 0) {
                  <span class="ee-actotal-mod">({{ modVal > 0 ? '+' : '' }}{{ modVal }})</span>
                }
              </div>

              <div class="ee-armor-row">
                <div class="ee-check">
                  <p-checkbox id="a-dex" formControlName="dexBonus" [binary]="true"></p-checkbox>
                  <label for="a-dex" class="ee-check-label bold">Dex Bonus</label>
                </div>
                <div class="ee-check">
                  <p-checkbox id="a-max" formControlName="maxBonus" [binary]="true"></p-checkbox>
                  <label for="a-max" class="ee-check-label bold">Max Bonus</label>
                </div>
                <div class="ee-field">
                  <label for="a-str" class="ee-label">Min Str</label>
                  <p-inputNumber id="a-str" formControlName="minimumStrength" [min]="0" [max]="30"
                                 [showButtons]="true"></p-inputNumber>
                </div>
              </div>
            </div>
          </p-fluid>

          <div class="ee-footer">
            <p-button label="Cancel" [text]="true" severity="secondary" (onClick)="close()" [disabled]="loading()"></p-button>

            <p-splitButton
              [label]="primarySaveLabel()"
              [icon]="loading() ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
              (onClick)="onSaveAttempt()"
              [model]="saveOptions()"
              [disabled]="loading() || armorForm.invalid">
            </p-splitButton>
          </div>
        </form>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</p-dialog>
