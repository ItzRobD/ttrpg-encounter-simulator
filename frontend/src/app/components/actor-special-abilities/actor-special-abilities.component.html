<div class="sa-list">
  @for (feature of features(); track feature.id) {
    <div class="sa-item">
      <div class="sa-head">
        <i class="pi pi-sparkles sa-icon"></i>
        <span class="sa-name">{{ feature.name }}</span>
      </div>
      <p class="sa-desc">{{ feature.description }}</p>
    </div>
  }
</div>
